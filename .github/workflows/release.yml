name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Versioning only. Publishing to npm is done by hand, from a maintainer's
      # machine — see "Releasing" in meta/conventions.md — so this workflow has
      # no npm token and never runs `changeset publish`.
      #
      # With pending changesets this opens (or updates) the "Version Packages"
      # PR. Merging that PR bumps the versions and writes the changelogs; the
      # publish is the maintainer's next step.
      - name: Version packages
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
