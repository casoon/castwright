name: Publish

# Tag `vX.Y.Z` (after the "Version Packages" PR is merged) → verify, then publish
# the three packages to npm with Trusted Publishing (provenance, no stored token)
# after approval in the `npm` environment. The tag must match the package versions.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same pins as the `compat` job in ci.yml — keep them in step.
    env:
      AGG_VERSION: v1.9.0
      ASCIINEMA_VERSION: v3.2.1
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag matches the package versions
        run: |
          for p in core player astro; do
            test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./packages/$p/package.json').version")"
          done

      # The root CHANGELOG is hand-maintained (Changesets only writes the
      # per-package ones): it needs a dated section for this version. The
      # keep-a-changelog script lives outside the repository, so the check
      # here is the part that matters for a release.
      - name: Root CHANGELOG has a section for the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Eq "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "CHANGELOG.md has no '## [$version] - YYYY-MM-DD' section"; exit 1; }
          grep -q '^## \[Unreleased\]' CHANGELOG.md \
            || { echo "CHANGELOG.md lost its '## [Unreleased]' heading"; exit 1; }

      - name: Install asciinema and agg
        run: |
          base=https://github.com/asciinema
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/agg" \
            "$base/agg/releases/download/$AGG_VERSION/agg-x86_64-unknown-linux-gnu"
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/asciinema" \
            "$base/asciinema/releases/download/$ASCIINEMA_VERSION/asciinema-x86_64-unknown-linux-gnu"
          chmod +x "$RUNNER_TEMP/agg" "$RUNNER_TEMP/asciinema"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - run: pnpm test
      - run: pnpm test:pack
      - run: pnpm test:compat --require-tools

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Pinned to a major: this job holds id-token: write, so no moving target.
      - name: Update npm (Trusted Publishing needs >= 11.5)
        run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # `pnpm pack` rewrites the workspace: ranges; `npm publish` of the tarball
      # signs the provenance. The order is the dependency order. A release
      # interrupted halfway is finished by running the job again.
      - name: Publish
        run: |
          set -euo pipefail
          for p in player core astro; do
            dir="packages/$p"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is on npm already — skipped"
              continue
            fi
            (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP")
            tarball="$RUNNER_TEMP/$(echo "${name#@}" | tr '/' '-')-$version.tgz"
            npm publish --access public "$tarball"
          done

  # After a successful publish: the GitHub Release carries the CHANGELOG section.
  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists already — skipped"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\] - " { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
